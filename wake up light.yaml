alias: Wake-up light
description: >-
  Zonsopkomst van dieprood via oranje naar warm wit licht (starttijd instelbaar
  via input_datetime.wake_up_tijd)
triggers:
  - trigger: time
    at: input_datetime.wake_up_tijd
conditions:
  - condition: time
    weekday:
      - mon
      - tue
      - wed
      - thu
actions:
  - action: light.turn_on
    target:
      entity_id: light.hobbykamer_studio_plafondlamp_hobbykamer_studio
    data:
      hs_color:
        - 10
        - 100
      brightness_pct: 4
      transition: 5
  - delay:
      seconds: 5
  - action: light.turn_on
    target:
      entity_id: light.hobbykamer_studio_plafondlamp_hobbykamer_studio
    data:
      hs_color:
        - 10
        - 100
      brightness_pct: 31
      transition: 300
  - delay:
      seconds: 300
  - condition: state
    entity_id: light.hobbykamer_studio_plafondlamp_hobbykamer_studio
    state: 'on'
  - action: light.turn_on
    target:
      entity_id: light.hobbykamer_studio_plafondlamp_hobbykamer_studio
    data:
      hs_color:
        - 30
        - 70
      brightness_pct: 31
      transition: 240
  - delay:
      seconds: 240
  - condition: state
    entity_id: light.hobbykamer_studio_plafondlamp_hobbykamer_studio
    state: 'on'
  - action: light.turn_on
    target:
      entity_id: light.hobbykamer_studio_plafondlamp_hobbykamer_studio
    data:
      color_temp_kelvin: 2900
      brightness_pct: 60
      transition: 240
  - delay:
      seconds: 240
  - condition: state
    entity_id: light.hobbykamer_studio_plafondlamp_hobbykamer_studio
    state: 'on'
  - action: light.turn_on
    target:
      entity_id: light.hobbykamer_studio_plafondlamp_hobbykamer_studio
    data:
      brightness_pct: 100
      transition: 240
  - delay:
      minutes: 20
  - action: light.turn_off
    target:
      entity_id: light.hobbykamer_studio_plafondlamp_hobbykamer_studio
mode: single
