blueprint:
  name: Wake-up light met vogelgeluiden
  description: >-
    Kunstmatige zonsopkomst met instelbare duur: de lamp gaat direct aan op 1% oranjerood
    (zonder witte flits), wordt oranje, amber en daarna warm wit tot de ingestelde
    eindhelderheid en kleurtemperatuur. Alle stappen schalen mee met de duur.
    Tegelijk start na een instelbare tijd een afspeellijst via Music Assistant, die een
    instelbare tijd na vol licht weer stopt, ook als de lamp eerder is uitgezet.
    Wordt de lamp tussendoor uitgezet, dan stopt het lichtverloop.
    De vogeltjes lijst is spotify--BBULG97m://playlist/4qCgX72abNlDfqsnzY7CxX
  domain: automation
  author: Jeroen
  homeassistant:
    min_version: "2024.10.0"
  input:
    tijd:
      name: Wanneer
      icon: mdi:alarm
      input:
        wake_time:
          name: Wektijd
          description: Een tijd-helper (input_datetime met alleen tijd).
          selector:
            entity:
              domain: input_datetime
        weekdays:
          name: Dagen
          default: [mon, tue, wed, thu, fri]
          selector:
            select:
              multiple: true
              mode: list
              options:
                - { label: Maandag, value: mon }
                - { label: Dinsdag, value: tue }
                - { label: Woensdag, value: wed }
                - { label: Donderdag, value: thu }
                - { label: Vrijdag, value: fri }
                - { label: Zaterdag, value: sat }
                - { label: Zondag, value: sun }
    licht:
      name: Licht
      icon: mdi:lightbulb-on
      input:
        wake_light:
          name: Lamp
          description: Een kleurenlamp (kleur en kleurtemperatuur).
          selector:
            entity:
              domain: light
        duration:
          name: Duur zonsopkomst
          description: Minuten van 1% tot de eindhelderheid. Alle kleurstappen schalen mee.
          default: 17
          selector:
            number: { min: 3, max: 60, unit_of_measurement: min, mode: box }
        end_brightness:
          name: Eindhelderheid
          default: 100
          selector:
            number: { min: 10, max: 100, unit_of_measurement: "%", mode: slider }
        end_kelvin:
          name: Eindkleurtemperatuur
          default: 3000
          selector:
            number: { min: 2200, max: 6500, step: 100, unit_of_measurement: K, mode: box }
        light_off_after:
          name: Lamp uit na vol licht
          description: Minuten na het bereiken van de eindstand dat de lamp uitgaat (0 = blijft aan).
          default: 16
          selector:
            number: { min: 0, max: 120, unit_of_measurement: min, mode: box }
    geluid:
      name: Geluid
      icon: mdi:bird
      input:
        sound_enabled:
          name: Geluid afspelen
          default: true
          selector:
            boolean: {}
        speaker:
          name: Speaker (Music Assistant)
          selector:
            entity:
              domain: media_player
              integration: music_assistant
        media_id:
          name: Afspeellijst
          description: Music Assistant-media-id of URI van de afspeellijst.
          selector:
            text: {}
        volume:
          name: Volume
          default: 30
          selector:
            number: { min: 1, max: 100, unit_of_measurement: "%", mode: slider }
        sound_delay:
          name: Geluid start na
          description: Minuten na de wektijd dat het geluid begint.
          default: 5
          selector:
            number: { min: 0, max: 30, unit_of_measurement: min, mode: box }
        sound_stop_after:
          name: Geluid stopt na vol licht
          description: Minuten na het bereiken van de eindstand dat het geluid stopt.
          default: 10
          selector:
            number: { min: 0, max: 120, unit_of_measurement: min, mode: box }

mode: single
max_exceeded: silent

variables:
  lamp: !input wake_light
  duration_min: !input duration
  end_bri: !input end_brightness
  end_k: !input end_kelvin
  light_off_min: !input light_off_after
  sound_on: !input sound_enabled
  sound_delay_min: !input sound_delay
  sound_stop_min: !input sound_stop_after
  volume_pct: !input volume
  # Stappen: hs = kleur, kf = positie tussen 2200 K en eindkleurtemperatuur,
  # bri = % van de eindhelderheid, w = aandeel in de duur (w 0 = vaste 3 s overgang).
  steps:
    - { hs: [18, 100], bri: 6, w: 2 }
    - { hs: [24, 95], bri: 16, w: 3 }
    - { hs: [28, 85], bri: 28, w: 3 }
    - { hs: [30, 75], bri: 42, w: 3 }
    - { kf: 0, bri: 44, w: 0 }
    - { kf: 0.625, bri: 72, w: 3 }
    - { kf: 1, bri: 100, w: 3 }
  duration_s: "{{ (duration_min | float) * 60 }}"
  # 2 s startmoment + 3 s wissel naar kleurtemperatuur gaan van de duur af.
  ramp_s: "{{ [duration_s - 5, 60] | max }}"
  w_total: "{{ steps | map(attribute='w') | sum }}"
  sound_duration_s: "{{ [duration_s - (sound_delay_min | int) * 60 + (sound_stop_min | int) * 60, 60] | max }}"

triggers:
  - trigger: time
    at: !input wake_time

conditions:
  - condition: time
    weekday: !input weekdays

actions:
  - parallel:
      - sequence:
          - action: light.turn_on
            target: { entity_id: "{{ lamp }}" }
            data: { hs_color: [12, 100], brightness_pct: 1 }
          - delay: { seconds: 2 }
          - repeat:
              for_each: "{{ steps }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ is_state(lamp, 'on') }}"
                  then:
                    - variables:
                        s: "{{ repeat.item }}"
                        t: "{{ ((s.w / w_total) * ramp_s) | round(1) if s.w > 0 else 3 }}"
                        b: "{{ [((s.bri * end_bri) / 100) | round(0) | int, 1] | max }}"
                    - action: light.turn_on
                      target: { entity_id: "{{ lamp }}" }
                      data: >-
                        {% if s.hs is defined %}
                          {{ {'hs_color': s.hs, 'brightness_pct': b, 'transition': t} }}
                        {% else %}
                          {{ {'color_temp_kelvin': (2200 + (end_k - 2200) * s.kf) | int,
                              'brightness_pct': b, 'transition': t} }}
                        {% endif %}
                    - delay: { seconds: "{{ t }}" }
          - condition: template
            value_template: "{{ (light_off_min | int) > 0 and is_state(lamp, 'on') }}"
          - delay: { minutes: "{{ light_off_min | int }}" }
          - action: light.turn_off
            target: { entity_id: "{{ lamp }}" }
      - sequence:
          - condition: template
            value_template: "{{ sound_on }}"
          - delay: { minutes: "{{ sound_delay_min | int }}" }
          - action: media_player.volume_set
            continue_on_error: true
            target: { entity_id: !input speaker }
            data: { volume_level: "{{ (volume_pct | float) / 100 }}" }
          - action: music_assistant.play_media
            continue_on_error: true
            target: { entity_id: !input speaker }
            data:
              media_id: !input media_id
              media_type: playlist
              enqueue: replace
          - delay: { seconds: "{{ sound_duration_s | int }}" }
          - action: media_player.media_stop
            continue_on_error: true
            target: { entity_id: !input speaker }
