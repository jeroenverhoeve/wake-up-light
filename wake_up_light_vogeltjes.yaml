blueprint:
  name: Wake-up light met vogelgeluiden
  description: >-
    Kunstmatige zonsopkomst van ongeveer 17 minuten: de lamp gaat direct aan op 1% oranjerood
    (zonder witte flits), wordt oranje, amber en daarna warm wit tot 100% op 3000 K.
    Tegelijk start na een instelbare tijd een afspeellijst (bijvoorbeeld vogelgeluiden) via
    Music Assistant, die een instelbare tijd na vol licht weer stopt, ook als de lamp eerder
    is uitgezet. Wordt de lamp tussendoor uitgezet, dan stopt het lichtverloop.
  domain: automation
  author: JOUW-GITHUB-NAAM
  source_url: https://github.com/JOUW-GITHUB-NAAM/JOUW-REPO/blob/main/wake_up_light_vogels.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    tijd:
      name: Wanneer
      icon: mdi:alarm
      input:
        wake_time:
          name: Wektijd
          description: Een tijd-helper (input_datetime met alleen tijd), zodat je de tijd op een dashboard kunt aanpassen.
          selector:
            entity:
              domain: input_datetime
        weekdays:
          name: Dagen
          default: [mon, tue, wed, thu, fri]
          selector:
            select:
              multiple: true
              mode: list
              options:
                - { label: Maandag, value: mon }
                - { label: Dinsdag, value: tue }
                - { label: Woensdag, value: wed }
                - { label: Donderdag, value: thu }
                - { label: Vrijdag, value: fri }
                - { label: Zaterdag, value: sat }
                - { label: Zondag, value: sun }
    licht:
      name: Licht
      icon: mdi:lightbulb-on
      input:
        wake_light:
          name: Lamp
          description: Een kleurenlamp (kleur en kleurtemperatuur).
          selector:
            entity:
              domain: light
        light_off_after:
          name: Lamp uit na vol licht
          description: Minuten na het bereiken van 100% dat de lamp weer uitgaat (0 = blijft aan).
          default: 16
          selector:
            number: { min: 0, max: 120, unit_of_measurement: min, mode: box }
    geluid:
      name: Geluid
      icon: mdi:bird
      input:
        sound_enabled:
          name: Geluid afspelen
          default: true
          selector:
            boolean: {}
        speaker:
          name: Speaker (Music Assistant)
          selector:
            entity:
              domain: media_player
              integration: music_assistant
        media_id:
          name: Afspeellijst
          description: >-
            Music Assistant-media-id of URI van de afspeellijst. Tip: start de afspeellijst
            één keer in Music Assistant en kopieer de URI uit het menu van de afspeellijst.
          selector:
            text: {}
        volume:
          name: Volume
          default: 30
          selector:
            number: { min: 1, max: 100, unit_of_measurement: "%", mode: slider }
        sound_delay:
          name: Geluid start na
          description: Minuten na de wektijd dat het geluid begint.
          default: 5
          selector:
            number: { min: 0, max: 30, unit_of_measurement: min, mode: box }
        sound_stop_after:
          name: Geluid stopt na vol licht
          description: Minuten na het bereiken van 100% licht dat het geluid stopt.
          default: 10
          selector:
            number: { min: 0, max: 120, unit_of_measurement: min, mode: box }

mode: single
max_exceeded: silent

variables:
  lamp: !input wake_light
  sound_on: !input sound_enabled
  sound_delay_min: !input sound_delay
  sound_stop_min: !input sound_stop_after
  volume_pct: !input volume
  light_off_min: !input light_off_after
  # Het lichtverloop duurt 1025 seconden tot 100%.
  sound_duration_s: "{{ [1025 - (sound_delay_min | int) * 60 + (sound_stop_min | int) * 60, 60] | max }}"

triggers:
  - trigger: time
    at: !input wake_time

conditions:
  - condition: time
    weekday: !input weekdays

actions:
  - parallel:
      - sequence:
          - action: light.turn_on
            target: { entity_id: "{{ lamp }}" }
            data: { hs_color: [12, 100], brightness_pct: 1 }
          - delay: { seconds: 2 }
          - action: light.turn_on
            target: { entity_id: "{{ lamp }}" }
            data: { hs_color: [18, 100], brightness_pct: 6, transition: 120 }
          - delay: { seconds: 120 }
          - condition: template
            value_template: "{{ is_state(lamp, 'on') }}"
          - action: light.turn_on
            target: { entity_id: "{{ lamp }}" }
            data: { hs_color: [24, 95], brightness_pct: 16, transition: 180 }
          - delay: { seconds: 180 }
          - condition: template
            value_template: "{{ is_state(lamp, 'on') }}"
          - action: light.turn_on
            target: { entity_id: "{{ lamp }}" }
            data: { hs_color: [28, 85], brightness_pct: 28, transition: 180 }
          - delay: { seconds: 180 }
          - condition: template
            value_template: "{{ is_state(lamp, 'on') }}"
          - action: light.turn_on
            target: { entity_id: "{{ lamp }}" }
            data: { hs_color: [30, 75], brightness_pct: 42, transition: 180 }
          - delay: { seconds: 180 }
          - condition: template
            value_template: "{{ is_state(lamp, 'on') }}"
          - action: light.turn_on
            target: { entity_id: "{{ lamp }}" }
            data: { color_temp_kelvin: 2200, brightness_pct: 44, transition: 3 }
          - delay: { seconds: 3 }
          - action: light.turn_on
            target: { entity_id: "{{ lamp }}" }
            data: { color_temp_kelvin: 2700, brightness_pct: 72, transition: 180 }
          - delay: { seconds: 180 }
          - condition: template
            value_template: "{{ is_state(lamp, 'on') }}"
          - action: light.turn_on
            target: { entity_id: "{{ lamp }}" }
            data: { color_temp_kelvin: 3000, brightness_pct: 100, transition: 180 }
          - delay: { seconds: 180 }
          - condition: template
            value_template: "{{ (light_off_min | int) > 0 }}"
          - delay: { minutes: "{{ light_off_min | int }}" }
          - action: light.turn_off
            target: { entity_id: "{{ lamp }}" }
      - sequence:
          - condition: template
            value_template: "{{ sound_on }}"
          - delay: { minutes: "{{ sound_delay_min | int }}" }
          - action: media_player.volume_set
            continue_on_error: true
            target: { entity_id: !input speaker }
            data: { volume_level: "{{ (volume_pct | float) / 100 }}" }
          - action: music_assistant.play_media
            continue_on_error: true
            target: { entity_id: !input speaker }
            data:
              media_id: !input media_id
              media_type: playlist
              enqueue: replace
          - delay: { seconds: "{{ sound_duration_s | int }}" }
          - action: media_player.media_stop
            continue_on_error: true
            target: { entity_id: !input speaker }
